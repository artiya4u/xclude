<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>X-Clude settings</title>
  <style>
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f1419; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin: 28px 0 8px; }
    fieldset { border: 1px solid #cfd9de; border-radius: 8px; margin: 0 0 12px; }
    label { display: block; margin: 6px 0; }
    input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    .hint { color: #536471; font-size: 12px; }
    button { padding: 8px 16px; font: inherit; cursor: pointer; }
    #status { margin-left: 12px; color: #00ba7c; }
    @media (prefers-color-scheme: dark) {
      body { background: #15202b; color: #e7e9ea; }
      fieldset { border-color: #38444d; }
      .hint { color: #8b98a5; }
    }
  </style>
</head>
<body>
  <h1>X-Clude settings</h1>

  <h2>What to hide</h2>
  <fieldset id="categories"></fieldset>

  <label>Display mode
    <select id="mode">
      <option value="label">Label posts (keep visible with a colored tag)</option>
      <option value="hide">Hide posts (with a Show button)</option>
    </select>
  </label>

  <label>Sensitivity
    <select id="sensitivity">
      <option value="relaxed">Relaxed – only obvious cases</option>
      <option value="balanced">Balanced</option>
      <option value="strict">Strict – hide more</option>
    </select>
  </label>

  <h2>Never hide posts from</h2>
  <textarea id="allowlist" rows="3" placeholder="one handle per line, without @"></textarea>

  <h2>AI classification (optional)</h2>
  <p class="hint">Built-in rules run locally. Add a <a href="https://docs.typesafe.ai/introduction" target="_blank" rel="noreferrer">TypeSafe (Jev)</a> API key and posts the rules don't catch are also classified by Jev. Post text is sent to api.typesafe.ai; the author is not. Leave blank to stay fully local.</p>
  <label>API key <input type="password" id="apiKey" autocomplete="off"></label>

  <p><button id="save">Save</button><span id="status"></span></p>

  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
